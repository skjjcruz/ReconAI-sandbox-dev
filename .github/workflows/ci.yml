name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Test the same exact shared source used by the Pages release.
      - name: Read reviewed shared revision
        id: shared-revision
        shell: bash
        run: |
          revision="$(tr -d '\r\n' < .dhq-shared-revision)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid shared revision'; exit 1; }
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
      - name: Checkout DHQ-Shared (canonical engine)
        uses: actions/checkout@v6
        with:
          repository: skjjcruz/DHQ-Shared
          ref: ${{ steps.shared-revision.outputs.sha }}
          path: dhq-shared-src
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync shared engine from DHQ-Shared
        run: DHQ_SHARED_SOURCE="$GITHUB_WORKSPACE/dhq-shared-src" npm run sync:shared
      - run: npx eslint . --ext .js
      - run: node tests/unit.js
