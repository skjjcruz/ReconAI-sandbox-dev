name: Deploy ReconAI Supabase Edge Functions

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/**"
      - "scripts/proxy-release-preflight.sql"
      - "scripts/verify-yahoo-client-release.py"
      - "scripts/yahoo-client-release.json"
      - "tests/yahoo-*"
      - ".dhq-shared-revision"
      - "tests/proxy-*.cjs"
      - "tests/proxy-cors-contract.js"
      - "tests/helpers/proxy-ts-loader.cjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Read exact reviewed Yahoo shared revision
        id: shared-revision
        shell: bash
        run: |
          revision="$(tr -d '\r\n' < .dhq-shared-revision)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid shared revision'; exit 1; }
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
      - name: Checkout reviewed shared client for actual protocol tests
        uses: actions/checkout@v6
        with:
          repository: skjjcruz/DHQ-Shared
          ref: ${{ steps.shared-revision.outputs.sha }}
          path: dhq-shared-src

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - name: Verify provider boundaries without hosted credentials
        env:
          SUPABASE_ACCESS_TOKEN: ""
        run: |
          npm ci --ignore-scripts
          npm run test:proxy-cors
          npm run test:proxy-runtime
          python3 tests/yahoo-release-guard.py
          DHQ_SHARED_SOURCE="$GITHUB_WORKSPACE/dhq-shared-src" npm run sync:shared
          node "$GITHUB_WORKSPACE/dhq-shared-src/tests/yahoo-browser-binding.cjs"
          READINESS_YAHOO_SHARED="$GITHUB_WORKSPACE/dhq-shared-src" node tests/yahoo-handshake-integration.cjs

      # When the deploy token isn't configured (e.g. this sandbox repo), skip
      # the deploy cleanly instead of failing the whole run. Every step below
      # is gated on the token being present, so the job ends green as a no-op.
      - name: Check for Supabase deploy token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set — skipping Edge Function deploy (expected on sandbox/forks)."
          else
            echo "Supabase deploy token present — proceeding with deploy."
          fi

      - uses: supabase/setup-cli@v2.1.1
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        with:
          version: latest

      - uses: denoland/setup-deno@v2
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        with:
          deno-version: v2.x

      - name: Type check Edge Functions
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          for fn in supabase/functions/*/index.ts; do
            deno check --node-modules-dir=auto "$fn"
          done

      - name: Verify ReconAI database migrations are recorded
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, os, sys
          token = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          expected = {
              '016': 'supabase/migrations/016_analytics_rollups.sql',
              '017': 'supabase/migrations/017_tutorial_state.sql',
              '018': 'supabase/migrations/018_security_identity_hardening.sql',
          }

          for path in expected.values():
              if not os.path.exists(path):
                  print('Migration missing:', path, file=sys.stderr)
                  sys.exit(1)

          quoted_versions = ', '.join(f"'{version}'" for version in expected)
          query = f'select version from supabase_migrations.schema_migrations where version in ({quoted_versions})'
          req = urllib.request.Request(
              'https://api.supabase.com/v1/projects/sxshiqyxhhifvtfqawbq/database/query',
              data=json.dumps({'query': query}).encode(),
              headers={
                  'Authorization': f'Bearer {token}',
                  'Content-Type':  'application/json',
                  'Accept': 'application/json',
                  'User-Agent': 'ReconAI-WarRoom-GitHub-Actions',
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(req) as r:
                  body = r.read().decode()
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print('Migration verification response:', e.code, body, file=sys.stderr)
              sys.exit(1)

          try:
              payload = json.loads(body)
          except json.JSONDecodeError:
              print('Migration verification returned non-JSON:', body[:300], file=sys.stderr)
              sys.exit(1)

          found = {str(row.get('version')) for row in payload if isinstance(row, dict)}
          missing = sorted(set(expected) - found)
          if missing:
              print('Migrations not recorded:', ', '.join(missing), file=sys.stderr)
              sys.exit(1)

          print('Recorded migrations:', ', '.join(sorted(found & set(expected))))

          # Existing provider state schemas must match the reviewed contract.
          # This fixed query contains no migration or data mutation.
          with open('scripts/proxy-release-preflight.sql') as f:
              preflight_query = f.read()
          req = urllib.request.Request(
              'https://api.supabase.com/v1/projects/sxshiqyxhhifvtfqawbq/database/query',
              data=json.dumps({'query': preflight_query}).encode(),
              headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req) as r:
                  checks = json.load(r)
          except Exception:
              print('Provider schema preflight unavailable; no functions deployed.', file=sys.stderr)
              sys.exit(1)
          expected_checks = {'state_columns', 'account_version_column', 'owner_binding_column', 'state_private', 'tokens_private', 'state_atomic_key', 'reviewed_atomic_limiter'}
          if not isinstance(checks, list) or len(checks) != 1 or not isinstance(checks[0], dict) or set(checks[0]) != expected_checks or any(value is not True for value in checks[0].values()):
              print('Provider schema compatibility checks failed; no functions deployed.', file=sys.stderr)
              sys.exit(1)
          print('Provider schema compatibility: all checks passed.')
          PYEOF

      - name: Require reviewed Yahoo consumer bytes already served
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: python3 scripts/verify-yahoo-client-release.py

      - name: Deploy espn-proxy function
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy espn-proxy --project-ref sxshiqyxhhifvtfqawbq --use-api --no-verify-jwt

      - name: Deploy mfl-proxy function
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy mfl-proxy --project-ref sxshiqyxhhifvtfqawbq --use-api --no-verify-jwt

      - name: Deploy yahoo-proxy function
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy yahoo-proxy --project-ref sxshiqyxhhifvtfqawbq --use-api --no-verify-jwt
